name: Python Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install pytest ruff fastapi httpx

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t myapp .

      - name: Run Docker container
        run: docker run -d -p 8000:8000 --name myapp-container myapp

      - name: Wait for API
        run: sleep 5

      - name: Test API with curl
        run: curl http://localhost:8000

      - name: Validate API response
        run: |
          response=$(curl -s http://localhost:8000)
          echo "$response"
          test "$response" = '{"message":"Hello Docker FastAPI"}'

      - name: Validate dynamic API response
        run: |
          response=$(curl -s http://localhost:8000/hello/Taro)
          echo "$response"
          test "$response" = '{"message":"Hello Taro"}'

      - name: Validate POST API response
        run: |
          response=$(curl -s -X POST http://localhost:8000/echo \
            -H "Content-Type: application/json" \
            -d '{"name":"Taro"}')
          echo "$response"
          test "$response" = '{"message":"Hello Taro"}'